<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital clock</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="pink"></div>
    <div class="clock">
        <div class="time">
        <span id="hours">00</span>
        <span>:</span>
        <span id="mins">00</span>
        <span>:</span>
        <span id="sec">00</span>
        </div>
        <div class="bottom">
            <h4>HOURS</h4>
            <h4>MINS</h4>
            <h4>SEC</h4>
        </div>
    </div>
    <div class="blue"></div>
    <script src="./main.js"></script>
</body>
</html>
